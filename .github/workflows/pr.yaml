---
name: pr

on:
  pull_request:
    branches:
      - main
      - spiceai
      - spiceai-*

# A new push to a pull request cancels its earlier run, so superseded commits
# don't hold runners in the shared self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the self-hosted `spiceai-dev-runners` pool and skips pull
# requests from forks; non-PR events and same-repository pull requests still
# run. The skip keeps an unmodified workflow from scheduling fork code on the
# pool, but a fork's pull request runs its own copy of this file and can remove
# it. The boundary is the repository's fork-run approval setting, which holds
# every outside contributor's run until a maintainer approves it: don't approve
# a fork run whose pull request changes `.github/` without reading that change.
jobs:
  lint:
    name: Clippy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: spiceai-dev-runners

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - run: cargo clippy --all-features -- -D warnings

      # `make test` runs only `--lib`, so nothing else in CI compiles the
      # integration suite. Type-check it here (no Docker required) so it can't
      # silently rot.
      - name: Check integration tests compile
        run: make check-integration

  build:
    name: Build (${{ matrix.features }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: spiceai-dev-runners

    strategy:
      matrix:
        features:
          - 'no-default-features'
          - 'clickhouse'
          - 'duckdb'
          - 'postgres'
          - 'sqlite'
          - 'mysql'
          - 'flight'
          - 'adbc'
          - 'mongodb'

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build with ${{ matrix.features }}
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo check --no-default-features
          else
            cargo check --no-default-features --features ${{ matrix.features }}
          fi

  integration-test:
    name: Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: spiceai-dev-runners

    env:
      PG_DOCKER_IMAGE: ghcr.io/cloudnative-pg/postgresql:16-bookworm
      MYSQL_DOCKER_IMAGE: mysql:8.0

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-images-${{ env.PG_DOCKER_IMAGE }}-${{ env.MYSQL_DOCKER_IMAGE }}

      - name: Load or pull Docker images
        run: |
          if [ -f /tmp/docker-images/postgres.tar ] && [ -f /tmp/docker-images/mysql.tar ]; then
            echo "Loading cached Docker images..."
            docker load -i /tmp/docker-images/postgres.tar
            docker load -i /tmp/docker-images/mysql.tar
          else
            echo "Pulling Docker images..."
            docker pull ${{ env.PG_DOCKER_IMAGE }}
            docker pull ${{ env.MYSQL_DOCKER_IMAGE }}
            mkdir -p /tmp/docker-images
            docker save -o /tmp/docker-images/postgres.tar ${{ env.PG_DOCKER_IMAGE }}
            docker save -o /tmp/docker-images/mysql.tar ${{ env.MYSQL_DOCKER_IMAGE }}
          fi

      - name: Install ODBC & Sqlite
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          sudo apt-get install -y libsqlite3-dev

      - name: Install ADBC drivers
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          dbc install sqlite
          dbc install duckdb

      - name: Run tests
        run: make test

  duckdb-integration-test:
    name: DuckDB Tests (release)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: spiceai-dev-runners
  
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache entry: this is the only job that builds in release
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: duckdb-release

      - name: Run DuckDB integration tests
        run: make test-integration-duckdb

  python-integration-test:
    name: Python Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: spiceai-dev-runners

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            python

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject.toml'

      # Building datafusion-python from source (see python/pyproject.toml) needs protoc.
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ODBC, Sqlite and Roapi
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev libsqliteodbc
          sudo apt-get install -y libsqlite3-dev
          rustup toolchain install nightly
          cargo +nightly install --locked --git https://github.com/roapi/roapi --branch main --bins roapi

      - name: Build Python package and run tests
        run: |
          cd python
          uv sync --dev
          uv run --no-project maturin develop --uv --release
          cd python/tests
          uv run --no-project pytest -v .
